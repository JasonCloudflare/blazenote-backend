name = "blazenote-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = [ "nodejs_compat" ]

# Custom domain configuration
[[routes]]
pattern = "jasonapi.massive-accord.sxplab.com"
